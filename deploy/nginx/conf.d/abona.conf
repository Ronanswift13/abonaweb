# 北京艾博纳官网 · Nginx 反向代理
# - HTTP 统一跳转 HTTPS，裸域跳转 www
# - 反向代理至 Next.js 容器（web:3000），应用端口不直接暴露公网
# - 证书放在 deploy/nginx/certs/（fullchain.pem / privkey.pem），勿提交到仓库
# 【占位】域名与证书文件名按实际情况修改

upstream abona_web {
    server web:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# 简单限流：单 IP 每秒 20 个请求，突发 40
limit_req_zone $binary_remote_addr zone=abona_req:10m rate=20r/s;

# ---------- HTTP → HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name abonatech.com www.abonatech.com;

    # 证书签发校验（使用 certbot webroot 方式时）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.abonatech.com$request_uri;
    }
}

# ---------- 裸域 → www ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name abonatech.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://www.abonatech.com$request_uri;
}

# ---------- 正式站点 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.abonatech.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 安全响应头（应用层另有 X-Frame-Options 等，见 next.config.ts）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    access_log /var/log/nginx/abona.access.log;
    error_log  /var/log/nginx/abona.error.log warn;

    location / {
        limit_req zone=abona_req burst=40 nodelay;

        proxy_pass http://abona_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 文件名含内容哈希，可安全长期缓存；其他页面与资源沿用 Next.js 自身缓存策略
    location ^~ /_next/static/ {
        proxy_pass http://abona_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }
}
