# 北京艾博纳官网 · Docker Compose
#
# 仅启动网站（本机 http://localhost:3000）：
#   docker compose up -d --build
# 同时启动 Nginx（80/443，需先放置证书，见 README「生产部署」）：
#   docker compose --profile nginx up -d --build
#
# 可在同目录 .env 中覆盖变量（参考 .env.example）。

services:
  web:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.abonayaoer.com}
        NEXT_PUBLIC_BAIDU_TONGJI_ID: ${NEXT_PUBLIC_BAIDU_TONGJI_ID:-}
    image: abona-website:latest
    container_name: abona-website
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    # 默认只监听本机，由 Nginx 对外提供服务；如需直接对外访问，设置 WEB_BIND=0.0.0.0
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    # 健康检查定义在 Dockerfile（GET /api/health）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.28-alpine
    profiles: ["nginx"]
    container_name: abona-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/logs:/var/log/nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
